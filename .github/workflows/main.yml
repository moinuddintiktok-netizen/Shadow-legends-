name: Shadow Legends Neon War VIP 3D Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Game
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade Build Tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Check Python Syntax
        run: python -m py_compile shadow_legs_neon_war.py

      - name: Run Automated Tests
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            python -m unittest discover -s tests -v
          } else {
            Write-Host "No tests directory found; skipping tests."
          }

      - name: Build Windows EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name ShadowLegendsNeonWar
          --collect-all panda3d
          shadow_legs_neon_war.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist/ShadowLegendsNeonWar/ShadowLegendsNeonWar.exe"

          if (!(Test-Path $exe)) {
            throw "Build failed: EXE was not generated."
          }

          Write-Host "EXE found successfully: $exe"

      - name: Package Windows Game
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/ShadowLegendsNeonWar/*" `
            -DestinationPath "ShadowLegendsNeonWar-Windows.zip" `
            -Force

      - name: Upload Windows Game
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Legends-Neon-War-VIP-3D
          path: ShadowLegendsNeonWar-Windows.zip
          if-no-files-found: error
          retention-days: 14
